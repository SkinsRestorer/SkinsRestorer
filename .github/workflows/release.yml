name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
      after-version:
        description: 'Snapshot version after release'
        required: true

jobs:
  set-release-version:
    uses: SkinsRestorer/SkinsRestorer/.github/workflows/set-version.yml@dev
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  build:
    needs: set-release-version
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '27'
        distribution: 'temurin'
    - name: Build with Gradle
      run: ./gradlew build test --stacktrace --scan

    - name: Build Changelog
      id: github_release
      uses: mikepenz/release-changelog-builder-action@v6
      with:
        mode: COMMIT
        toTag: ${{ github.ref }}
        configurationJson: |
          {
            "template": "#{{CHANGELOG}}",
            "commit_template": "- [`#{{SHORT_MERGE_SHA}}`](https://github.com/SkinsRestorer/SkinsRestorer/commit/#{{MERGE_SHA}}) #{{TITLE}}",
            "categories": [
              {
                  "title": "## 🚀 Features",
                  "labels": ["feat", "feature"]
              },
              {
                  "title": "## 🐛 Fixes",
                  "labels": ["fix", "bug"]
              },
              {
                  "title": "## 🏎️ Performance",
                  "labels": ["perf"]
              },
              {
                  "title": "## 🏗 Refactor",
                  "labels": ["refactor"]
              },
              {
                  "title": "## 📝 Documentation",
                  "labels": ["docs"]
              },
              {
                  "title": "## 🔨 Build",
                  "labels": ["build", "chore", "ci"]
              },
              {
                  "title": "## 💅 Style",
                  "labels": ["style"]
              },
              {
                  "title": "## 🧪 Tests",
                  "labels": ["test"]
              },
              {
                  "title": "## 💬 Other",
                  "labels": []
              },
              {
                "title": "## 📦 Dependencies",
                "labels": ["dependencies"]
              }
            ],
            "empty_template": "no changes",
            "label_extractor": [
              {
                "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)",
                "on_property": "title",
                "target": "$1"
              }
            ],
            "custom_placeholders": [
              {
                "name": "SHORT_MERGE_SHA",
                "source": "MERGE_SHA",
                "transformer": {
                  "pattern": "^([0-9a-f]{7})[0-9a-f]*$",
                  "target": "$1"
                }
              }
            ]
          }
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install communique
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p "$RUNNER_TEMP/communique"
        gh release download v1.8.0 --repo jdx/communique --pattern communique-x86_64-unknown-linux-musl.tar.gz --output - | tar -xz -C "$RUNNER_TEMP/communique"
        echo "$RUNNER_TEMP/communique" >> "$GITHUB_PATH"

    - name: Generate release notes
      id: release_notes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        RELEASE_TAG: ${{ inputs.version }}
        RELEASE_URL: https://modrinth.com/plugin/skinsrestorer/version/${{ inputs.version }}
        COMMIT_CHANGELOG: ${{ steps.github_release.outputs.changelog }}
      run: |
        # The release step creates the real tag. A local tag lets communique find the release range now.
        git update-ref "refs/tags/$RELEASE_TAG" HEAD
        communique generate "$RELEASE_TAG" --tag-pattern '[0-9]*' --output "$RUNNER_TEMP/communique.md"
        # Drop the generated "# <tag>: <title>" heading because each release keeps its own name.
        sed '1{/^# /d}' "$RUNNER_TEMP/communique.md" | sed '/./,$!d' > "$RUNNER_TEMP/release-highlights.md"
        printf '\n\n<details>\n<summary>All commits</summary>\n\n%s\n\n</details>\n' "$COMMIT_CHANGELOG" | cat "$RUNNER_TEMP/release-highlights.md" - > "$RUNNER_TEMP/release-notes.md"
        python3 - "$RUNNER_TEMP/release-highlights.md" "$RELEASE_URL" > "$RUNNER_TEMP/discord.md" <<'PY'
        import re, sys
        # Show headings as bold text and keep the embed within Discord's 4096-character limit.
        text = re.sub(r"^#{1,6}\s+(.+)$", r"**\1**", open(sys.argv[1]).read(), flags=re.M).strip()
        more = f"\n\n[Read the full release notes]({sys.argv[2]})"
        if len(text) > 4096:
            text = text[: 4096 - len(more)].rsplit("\n", 1)[0] + more
        print(text)
        PY
        delimiter="EOF_$(openssl rand -hex 16)"
        {
          echo "discord<<$delimiter"
          cat "$RUNNER_TEMP/discord.md"
          echo
          echo "$delimiter"
          echo "notes<<$delimiter"
          cat "$RUNNER_TEMP/release-notes.md"
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"

    - name: Read modMcVersion from gradle.properties
      id: modMcVersion
      run: |
        modMcVersion=$(grep '^modMcVersion=' gradle.properties | cut -d'=' -f2-)
        echo "modMcVersion=$modMcVersion" >> "$GITHUB_OUTPUT"

    - name: Release to GitHub
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        github-tag: ${{ inputs.version }}
        github-generate-changelog: false
        github-draft: false
        github-prerelease: false
        github-commitish: dev
        github-token: ${{ secrets.GITHUB_TOKEN }}

        files: |
          build/libs/SkinsRestorer.jar
          build/libs/SkinsRestorer-Mod-Fabric-*.jar
          build/libs/SkinsRestorer-Mod-NeoForge-*.jar

        name: SkinsRestorer ${{ inputs.version }}
        version: ${{ inputs.version }}
        version-type: release
        changelog: |
          [![modrinth](https://cdn.jsdelivr.net/npm/@intergrav/devins-badges@3/assets/cozy/available/modrinth_vector.svg)](https://modrinth.com/plugin/skinsrestorer/version/${{ inputs.version }}) [![hangar](https://cdn.jsdelivr.net/npm/@intergrav/devins-badges@3/assets/cozy/available/hangar_vector.svg)](https://hangar.papermc.io/SRTeam/SkinsRestorer/versions/${{ inputs.version }})

          ${{ steps.release_notes.outputs.notes }}

        retry-attempts: 2
        retry-delay: 10000
        fail-mode: fail

    - name: Release plugin to Modrinth
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: skinsrestorer
        modrinth-featured: true
        modrinth-unfeature-mode: subset
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

        files: |
          build/libs/SkinsRestorer.jar

        name: SkinsRestorer ${{ inputs.version }}
        version: ${{ inputs.version }}
        version-type: release
        changelog: ${{ steps.release_notes.outputs.notes }}

        loaders: |
          bukkit
          bungeecord
          folia
          paper
          purpur
          spigot
          velocity
          waterfall
        game-versions: |
          >=1.8.0
        game-version-filter: releases
        java: |
          8
          11
          17
          21
          25

        retry-attempts: 2
        retry-delay: 10000
        fail-mode: fail

    - name: Release Fabric mod to Modrinth
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: skinsrestorer
        modrinth-featured: true
        # Unfeature all previous releases for this loader
        modrinth-unfeature-mode: loader-intersection
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

        files: |
          build/libs/SkinsRestorer-Mod-Fabric-*.jar

        name: SkinsRestorer ${{ inputs.version }} Fabric
        version: ${{ inputs.version }}-fabric
        version-type: release
        changelog: ${{ steps.release_notes.outputs.notes }}

        loaders: |
          fabric
        game-versions: |
          ${{ steps.modMcVersion.outputs.modMcVersion }}
        game-version-filter: releases
        java: |
          21
          25

        retry-attempts: 2
        retry-delay: 10000
        fail-mode: fail

    - name: Release NeoForge mod to Modrinth
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: skinsrestorer
        modrinth-featured: true
        # Unfeature all previous releases for this loader
        modrinth-unfeature-mode: loader-intersection
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

        files: |
          build/libs/SkinsRestorer-Mod-NeoForge-*.jar

        name: SkinsRestorer ${{ inputs.version }} NeoForge
        version: ${{ inputs.version }}-neoforge
        version-type: release
        changelog: ${{ steps.release_notes.outputs.notes }}

        loaders: |
          neoforge
        game-versions: |
          ${{ steps.modMcVersion.outputs.modMcVersion }}
        game-version-filter: releases
        java: |
          21
          25

        retry-attempts: 2
        retry-delay: 10000
        fail-mode: fail

    - name: Archive unsupported mod versions on Modrinth
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        MOD_MC_VERSION: ${{ steps.modMcVersion.outputs.modMcVersion }}
      run: |
        modrinth_curl=(
          --fail-with-body
          --silent
          --show-error
          --header "Authorization: $MODRINTH_TOKEN"
          --header "User-Agent: SkinsRestorer/SkinsRestorer (https://github.com/SkinsRestorer/SkinsRestorer)"
        )

        versions=$(curl "${modrinth_curl[@]}" https://api.modrinth.com/v2/project/skinsrestorer/version)
        unsupported_version_ids=$(jq --compact-output --arg game_version "$MOD_MC_VERSION" '
          [
            .[]
            | select(
                .status == "listed"
                and (.loaders | any(. == "fabric" or . == "neoforge"))
                and (.game_versions | index($game_version) == null)
              )
            | .id
          ]
        ' <<< "$versions")

        echo "Archiving $(jq 'length' <<< "$unsupported_version_ids") unsupported Modrinth versions"
        while IFS= read -r version_id; do
          curl "${modrinth_curl[@]}" \
            --request PATCH \
            --header "Content-Type: application/json" \
            --data '{"status":"archived"}' \
            "https://api.modrinth.com/v2/version/$version_id"
        done < <(jq --raw-output '.[]' <<< "$unsupported_version_ids")

    - name: Publish to Hangar
      run: ./gradlew publishPluginPublicationToHangar --stacktrace
      env:
        HANGAR_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        HANGAR_CHANGELOG: ${{ steps.release_notes.outputs.notes }}

    - name: Announce release on Discord
      uses: tsickert/discord-webhook@v7.0.0
      with:
        webhook-url: ${{ secrets.WEBHOOK_URL }}
        content: <@&1201133350916739173> New SkinsRestorer version released!
        embed-title: SkinsRestorer ${{ inputs.version }}
        embed-url: https://modrinth.com/plugin/skinsrestorer/version/${{ inputs.version }}
        embed-description: ${{ steps.release_notes.outputs.discord }}
        embed-color: 16641028
        embed-thumbnail-url: https://skinsrestorer.net/logo.png

  deploy-javadoc:
    needs: build
    uses: SkinsRestorer/SkinsRestorer/.github/workflows/deploy-javadoc.yml@dev
    secrets: inherit

  set-after-version:
    needs: deploy-javadoc
    uses: SkinsRestorer/SkinsRestorer/.github/workflows/set-version.yml@dev
    with:
      version: ${{ inputs.after-version }}
    secrets: inherit
