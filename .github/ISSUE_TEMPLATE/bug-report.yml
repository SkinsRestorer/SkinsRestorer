name: Bug report
description: Report a reproducible problem.
type: Bug
body:
- type: markdown
  attributes:
    value: For setup questions, read [the support guide](https://github.com/SkinsRestorer/SkinsRestorer/blob/dev/SUPPORT.md).
      Remove secrets and private data from reports.
- type: checkboxes
  id: prior-search
  attributes:
    label: Before submitting
    options:
    - label: I searched existing issues and the relevant documentation.
      required: true
- type: checkboxes
  id: installation
  attributes:
    label: Installation guide
    options:
    - label: I followed the installation guide or explained why the issue is unrelated to installation.
      required: true
- type: textarea
  id: problem
  attributes:
    label: What happened?
    description: Describe the observed problem and its effect.
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Steps to reproduce
    description: Give the smallest reproducible example. Use synthetic data.
    placeholder: '1. Prepare ...

      2. Run or open ...

      3. Observe ...'
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
    description: Describe the result you expected.
  validations:
    required: true
- type: dropdown
  id: platform
  attributes:
    label: Affected platform
    description: Select the platform where the issue occurs.
    options:
    - Bukkit / Spigot / Paper
    - BungeeCord / Waterfall
    - Velocity
    - Fabric or another mod loader
    - Several platforms
    - Not sure
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Versions and environment
    description: SkinsRestorer version, proxy/backend builds, Minecraft client/mod loader, Java version,
      relevant plugins, and redacted startup/error logs.
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Logs, screenshots, or configuration
    description: Include only relevant excerpts. Remove tokens, keys, cookies, personal data, and private
      host details.
- type: textarea
  id: integrations
  attributes:
    label: Related plugins and client mods
    description: List relevant plugins/mods and their versions. Include proxy and backend configuration
      when applicable.
