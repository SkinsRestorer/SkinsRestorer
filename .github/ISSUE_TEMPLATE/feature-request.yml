name: Feature request
description: Propose a focused change and explain its use case.
type: Feature
body:
- type: markdown
  attributes:
    value: For setup questions, read [the support guide](https://github.com/SkinsRestorer/SkinsRestorer/blob/dev/SUPPORT.md).
      Remove secrets and private data from reports.
- type: checkboxes
  id: prior-search
  attributes:
    label: Before submitting
    options:
    - label: I searched existing issues and the relevant documentation.
      required: true
- type: textarea
  id: problem
  attributes:
    label: Problem or use case
    description: Who encounters this limitation, and what task does it block?
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Proposed behavior
    description: Describe the result or API you want.
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Alternatives considered
    description: Describe existing options or workarounds.
- type: textarea
  id: compatibility
  attributes:
    label: Compatibility and context
    description: Include affected versions, integrations, migration needs, and relevant references.
